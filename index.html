<!DOCTYPE html>
<html>
<head>
  <title>Student Registration & Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #a7a5a3;
      font-family: Arial, sans-serif;
    }
    /* Wrapper to keep the title and all 3 boxes the exact same width and aligned */
    .main-wrapper {
      max-width: 700px;
      margin: 30px auto;
    }
    .title {
      text-align: center;
      background-color: rgb(124, 131, 228);
      padding: 20px;
      border-radius: 10px;
      border: 4px solid rgb(26, 19, 19);
      margin-bottom: 20px;
    }
    .section1, .section2, .section3 {
      text-align: left;
      margin-bottom: 20px; /* Only bottom margin so left/right edges align with .title */
      background-color: #eee6de;
      padding: 20px;
      border: 2px solid #060606;
      border-radius: 10px;
    }
    .section1 h4, .section2 h4, .section3 h4 {
      margin-bottom: 15px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 8px;
    }
    .submit-button {
      padding: 10px 25px;
      border: none;
      border-radius: 4px;
      background-color: #673ab7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-button:hover {
      background-color: #562da0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-wrapper">
      
      <div class="title">
        <h1>Student Information System</h1>
        <p class="mb-0">Please Fill Out Your Information</p>
      </div>

      <form>
        <!-- Section 1: Personal Information -->
        <div class="section1">
          <h4>Personal Information</h4>
          
          <div class="row mb-3 align-items-center">
            <div class="col-md-5">
              <label class="form-label mb-0">Enter Your Name:</label>
            </div>
            <div class="col-md-7">
              <input type="text" name="name" class="form-control">
            </div>
          </div>

          <div class="row mb-3 align-items-center">
            <div class="col-md-5">
              <label class="form-label mb-0">Enter Your Registration Number:</label>
            </div>
            <div class="col-md-7">
              <input type="text" name="regno" class="form-control">
            </div>
          </div>

          <div class="row mb-3 align-items-center">
            <div class="col-md-5">
              <label class="form-label mb-0">Date of Birth:</label>
            </div>
            <div class="col-md-7">
              <input type="date" name="dob" class="form-control">
            </div>
          </div>

          <div class="row align-items-center">
            <div class="col-md-5">
              <label class="form-label mb-0">Accommodation Details:</label>
            </div>
            <div class="col-md-7">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="stay" value="dayscholar" id="dayscholar">
                <label class="form-check-label" for="dayscholar">Day Scholar</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="stay" value="hostelite" id="hostelite">
                <label class="form-check-label" for="hostelite">Hostelite</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Section 2: Educational Background -->
        <div class="section2">
          <h4>Educational Background</h4>
          
          <div class="row align-items-center">
            <div class="col-md-5">
              <label class="form-label mb-0">Education:</label>
            </div>
            <div class="col-md-7">
              <select name="education" class="form-select">
                <option value="">Select</option>
                <option value="BE">B.E</option>
                <option value="BTech">B.Tech</option>
                <option value="Diploma">Diploma</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Section 3: Feedback -->
        <div class="section3">
          <h4>Feedback</h4>
          
          <div class="row">
            <div class="col-md-5">
              <label class="form-label">Your Feedback:</label>
            </div>
            <div class="col-md-7">
              <textarea name="feedback" rows="5" class="form-control"></textarea>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button type="submit" class="submit-button">Submit</button>
        </div>
      </form>

    </div>
  </div>
</body>
</html>
